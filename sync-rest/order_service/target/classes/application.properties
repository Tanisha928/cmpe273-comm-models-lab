server.port=8081
inventory.timeoutMs=3000

# Docker-compose service names will be: inventory, notification
inventory.baseUrl=${INVENTORY_URL:http://localhost:8082}
notification.baseUrl=${NOTIFICATION_URL:http://localhost:8083}

inventory.timeoutMs=${INVENTORY_TIMEOUT_MS:1000}
notification.timeoutMs=${NOTIFICATION_TIMEOUT_MS:1000}
